; FreeRTOS Q3 scheduling experiments - Arduino MKR Zero
;
; The FreeRTOS_SAMD21 library is used straight from lib_deps
; (.pio/libdeps/<env>/FreeRTOS_SAMD21 - nothing is copied or deleted).
; "-include include/FreeRTOSConfig.h" makes GCC read the application's
; config first in every file, so the library's own config is skipped.
;
; Pick the experiment with the environment selector in the VS Code status
; bar, then Build / Upload. Each environment builds its own binary in
; .pio/build/<env>/firmware.bin
;
;   same_priority : all three tasks SAME priority, run to completion
;   case_a        : (a) T1 > T2 > T3, run to completion
;   case_b        : (b) T1 > T2 > T3, preemptive, NO priority inheritance
;   case_c        : (c) T1 > T2 > T3, preemptive, priority inheritance

[platformio]
default_envs = same_priority

[env]
platform = atmelsam
board = mkrzero
framework = arduino
test_framework = unity
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
build_flags =
    -Wno-error=implicit-function-declaration
    -include include/FreeRTOSConfig.h
monitor_port = COM7        ; the USB-serial adapter's port (Device Manager)
monitor_speed = 115200     ; must match UART_BAUD_RATE in main.c
monitor_filters = time, log2file   ; timestamps on screen AND in logs\device-monitor-*.log

[env:same_priority]
build_flags = ${env.build_flags} -D EXPERIMENT=0

[env:case_a]
build_flags = ${env.build_flags} -D EXPERIMENT=1

[env:case_b]
build_flags = ${env.build_flags} -D EXPERIMENT=2

[env:case_c]
build_flags = ${env.build_flags} -D EXPERIMENT=3
