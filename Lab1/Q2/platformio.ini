; ECNG3006 - Unity unit testing of the calc library on the Arduino MKR Zero
; Two environments:
;   app           -> src/ (calc.c + NotUart.c + main.cpp), the main program
;   CalcUnityTest -> calc.c + NotUart.c + the Unity test suite
; Arduino.h is NOT used. The Arduino framework only supplies the start-up
; code, linker script and 48 MHz clock set-up; all I/O is done with sam.h.

[platformio]
default_envs = app

[env:app]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200

[env:CalcUnityTest]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<calc.c> +<NotUart.c> +<../CalcUnityTest/*.c> +<../CalcUnityTest/*.cpp> +<../unity/src/unity.c>
build_flags = -I src -I CalcUnityTest -I unity/src -D UNITY_INCLUDE_CONFIG_H
