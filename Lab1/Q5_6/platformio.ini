; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; PlatformIO project: cyclic executive on Arduino MKR Zero (bare-metal)
; framework = arduino is used ONLY for the startup code, linker script and
; bootloader upload. The Arduino library (Arduino.h) is NOT used in src/.
[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
monitor_filters = time, log2file

default_envs = mkrzero
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
monitor_port = /dev/ttyUSB0   ; check with: ls /dev/ttyUSB* /dev/ttyACM*
[platformio]
