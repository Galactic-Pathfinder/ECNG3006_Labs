; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
test_framework = unity
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
build_flags = -Wno-error=implicit-function-declaration
monitor_port = COM7 ; check with: ls /dev/ttyUSB* /dev/ttyACM*  (Windows: COMx)
monitor_speed = 115200      ; Q5 CHANGE: was 9600, must match the 115200 baud in uart_init()