[platformio]
[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
test_framework = unity
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
; Q4: -include adds the trace macros (include/trace_hooks.h) to every file
build_flags =
    -Wno-error=implicit-function-declaration
    -DtraceTASK_SWITCHED_OUT()=taskSwitchedOut((*pxCurrentTCB).uxTaskNumber,(*pxCurrentTCB).xStateListItem.pxContainer==pxReadyTasksLists+(*pxCurrentTCB).uxPriority,(*pxCurrentTCB).xEventListItem.pxContainer!=0,xTickCount)
    -DtraceTASK_SWITCHED_IN()=taskSwitchedIn((*pxCurrentTCB).uxTaskNumber,xTickCount)
monitor_port = COM7        ; your build is on Windows; check Device Manager for the real port
monitor_speed = 115200     ; must match the 115200 baud set in uart_init()
monitor_filters = time, log2file   ; timestamps on screen AND in logs\device-monitor-*.log

